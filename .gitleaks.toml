# Custom gitleaks rules for org-specific infrastructure identifiers.
# Used by the pre-commit hook (.githooks/pre-commit) and the CI workflow
# (.github/workflows/secret-scan.yml):
#     gitleaks detect --no-git --source . --config .gitleaks.toml
#
# THESE RULES DESCRIBE SHAPES, NEVER VALUES.
#
# The previous version enumerated the real AD domain, a real hostname, the
# corporate mail domains, the employer's registered name and seven internal IP
# ranges as regex literals - and then allowlisted this file, the hook and the
# workflow from being scanned. The scanner could not see its own configuration,
# so the audit that installed it reported every repository clean while this file
# published, in a PUBLIC repository, precisely the values it existed to keep out.
#
# Two rules follow from that:
#   1. A detection rule in a public repository may not name what it detects.
#      Match the shape - an internal-only namespace, a private address range -
#      and let the allowlist carry the documentation placeholders, which are
#      safe to name because they are reserved by RFC for exactly this.
#   2. Nothing here is exempt from scanning. If a check can only be written by
#      naming a real value, it does not belong in a committed config; keep it in
#      an untracked local one and say so, rather than shipping the value.
#
# What that costs: the employer-name check is gone from CI, and the address rule
# no longer knows which private ranges are actually ours. Both are broader now,
# not narrower - every RFC 1918 address and every internal-namespace host is
# flagged, so the failure mode is a false positive, never a silent miss.
title = "org infra scrub rules"

[[rules]]
id = "internal-namespace-host"
description = "Host or domain in an internal-only namespace"
regex = '''(?i)\b[a-z0-9][a-z0-9-]{0,62}\.(local|internal|corp|lan|intranet)\b'''

[[rules]]
id = "private-ipv4"
description = "Private (RFC 1918) IPv4 address"
regex = '''\b(10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3})\b'''

[allowlist]
description = "Documentation placeholders, reserved by RFC 5737, 6761 and 2606 and therefore safe to name."
regexes = [
  '''(?i)\b(example|test|invalid|localhost|demo)\.(local|internal|corp|lan|intranet)\b''',
  '''(?i)\b[a-z0-9][a-z0-9-]*\.example\.(local|com|net|org|test)\b''',
  '''\b(192\.0\.2|198\.51\.100|203\.0\.113)\.\d{1,3}\b''',
  '''\b127\.\d{1,3}\.\d{1,3}\.\d{1,3}\b''',
  '''\b10\.20\.\d{1,3}\.\d{1,3}\b''',
  '''\b172\.31\.222\.\d{1,3}\b''',
  '''\bDEMO-''',
]
