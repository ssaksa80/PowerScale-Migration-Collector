name: secret-scan
# Fails the build if real infrastructure identifiers (hostnames, domains,
# IP ranges, org names) are present in the tree. Rules + allowlist in
# .gitleaks.toml. Non-bypassable backstop to the local .githooks/pre-commit.
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run gitleaks
        run: |
          set -euo pipefail
          VER=8.18.4
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks detect --no-git --source . --config .gitleaks.toml --redact --exit-code 1
