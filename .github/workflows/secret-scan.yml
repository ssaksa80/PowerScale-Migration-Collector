name: secret-scan
# Fails the build if real infrastructure identifiers (hostnames, domains,
# IP ranges, org names) are committed. Rules + allowlist in .gitleaks.toml.
# This is the non-bypassable backstop to the local .githooks/pre-commit guard.
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        run: |
          set -euo pipefail
          VER=8.18.4
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --redact --exit-code 1 --log-opts="--all"
